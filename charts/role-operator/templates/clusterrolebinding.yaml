{{- if .Values.rbac.enabled }}
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "role-operator.rbacName" . }}
  labels:
    {{- include "role-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "role-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "role-operator.rbacName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
