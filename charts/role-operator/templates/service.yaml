apiVersion: v1
kind: Service
metadata:
  name: {{ include "role-operator.fullname" . }}
  labels:
    {{- include "role-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http-metrics
      protocol: TCP
      name: http-metrics
    - port: 8081
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "role-operator.selectorLabels" . | nindent 4 }}
